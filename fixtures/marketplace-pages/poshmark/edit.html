<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Poshmark — Edit listing (fixture)</title>
<script src="/_shared/fixture.js"></script>
<script>Fixture.requireLogin('/poshmark/login.html');</script>
<style>[hidden]{display:none!important}</style></head>
<body>
  <nav><a href="/closet/tester">My Closet</a></nav>
  <h1>Edit listing</h1>
  <div data-fixture-id="title"><input id="title" placeholder="What are you selling? (required)" value="Old title" /></div>
  <div data-fixture-id="description"><textarea id="desc" placeholder="Describe it! (required)">Old description</textarea></div>
  <div data-fixture-id="listingPrice"><label for="price">Listing Price</label><input id="price" value="1" /></div>
  <div data-fixture-id="availability"><label for="avail">Availability</label>
    <select id="avail"><option>For Sale</option><option>Not For Sale</option></select></div>
  <button id="update" type="button" data-fixture-id="update">Update</button>
  <button id="delete" type="button" data-fixture-id="delete">Delete Listing</button>
  <div id="dialog" role="dialog" aria-label="Delete listing" hidden><p>Delete this listing?</p>
    <button id="yes" type="button">Yes</button><button type="button" onclick="document.getElementById('dialog').hidden = true">No</button></div>
<script>
  Fixture.applyMissing();
  const $ = (id) => document.getElementById(id);
  if ($('update')) $('update').addEventListener('click', () => {
    localStorage.setItem('cl-availability', $('avail') ? $('avail').value : '');
    localStorage.setItem('cl-edit', JSON.stringify({ title: $('title') && $('title').value, description: $('desc') && $('desc').value, price: $('price') && $('price').value }));
    location.href = '/poshmark/closet/tester';
  });
  if ($('delete')) $('delete').addEventListener('click', () => { $('dialog').hidden = false; });
  $('yes').addEventListener('click', () => { localStorage.setItem('cl-deleted', '1'); location.href = '/poshmark/closet/tester'; });
</script>
</body></html>
